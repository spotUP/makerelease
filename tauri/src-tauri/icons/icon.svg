<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- makerelease app icon: a 3.5" floppy disk, the medium Amiga releases ship on,
       in the app's accent orange on its dark background. Source for icon.png;
       regenerate with: rsvg-convert -w 1024 -h 1024 icon.svg -o icon.png -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c2c"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eba45a"/>
      <stop offset="1" stop-color="#c47a30"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824 px plate centred in the 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#3a3a3a" stroke-width="3"/>
  <!-- disk body with the clipped top-right corner -->
  <path d="M262 232 H694 L792 330 V752 Q792 792 752 792 H272 Q232 792 232 752 V272 Q232 232 272 232 Z" fill="url(#disk)"/>
  <!-- metal shutter with its window -->
  <rect x="364" y="232" width="296" height="196" rx="14" fill="#1a1a1a"/>
  <rect x="552" y="266" width="66" height="128" rx="8" fill="url(#disk)"/>
  <!-- label: NFO text lines -->
  <rect x="300" y="492" width="424" height="260" rx="18" fill="#e0e0e0"/>
  <rect x="340" y="544" width="300" height="26" rx="13" fill="#1a1a1a"/>
  <rect x="340" y="602" width="344" height="26" rx="13" fill="#3a3a3a"/>
  <rect x="340" y="660" width="240" height="26" rx="13" fill="#3a3a3a"/>
</svg>
